name: Live to TEST reset preflight
on:
  push:
    branches: [ops/live-to-test-reset-20261105]
    paths: [.github/workflows/live-to-test-reset.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queuedrop-live-to-test-reset
  cancel-in-progress: false
jobs:
  preflight:
    environment: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify existing database credentials without exposing values
        env:
          PROD_PASSWORD: ${{ secrets.QUEUEDROP_PROD_DB_PASSWORD }}
          TEST_DATABASE_URL: ${{ secrets.QUEUEDROP_TEST_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.ok(process.env.PROD_PASSWORD, 'Missing QUEUEDROP_PROD_DB_PASSWORD');
          assert.ok(process.env.TEST_DATABASE_URL, 'Missing QUEUEDROP_TEST_DATABASE_URL');
          let connection = process.env.TEST_DATABASE_URL.trim();
          if (connection.startsWith('psql ')) connection = connection.slice(5).trim();
          connection = connection.replace(/^(?:export\s+)?(?:QUEUEDROP_TEST_DATABASE_URL|DATABASE_URL)\s*=\s*/, '');
          if ((connection.startsWith('"') && connection.endsWith('"')) || (connection.startsWith("'") && connection.endsWith("'")) || (connection.startsWith('`') && connection.endsWith('`'))) connection=connection.slice(1,-1).trim();
          let u;
          try { u = new URL(connection); }
          catch {
            console.error('Invalid database URL format. Safe diagnostics: '+JSON.stringify({postgresScheme:/^postgres(?:ql)?:\/\//.test(connection),multipleLines:/[\r\n]/.test(connection),passwordPlaceholder:/\[YOUR[-_]PASSWORD\]/i.test(connection),containsTestRef:connection.includes('tcgiwtfhqssulxwawimh')}));
            process.exit(1);
          }
          assert.ok(['postgres:', 'postgresql:'].includes(u.protocol));
          assert.ok(u.hostname === 'db.tcgiwtfhqssulxwawimh.supabase.co' || (u.hostname.endsWith('.pooler.supabase.com') && decodeURIComponent(u.username) === 'postgres.tcgiwtfhqssulxwawimh'), 'Refusing a target outside QueueDrop TEST');
          console.log('PASS: Production export and dedicated TEST connection credentials exist');
          NODE
      - name: Verify read-only TEST connectivity
        env:
          TEST_DATABASE_URL: ${{ secrets.QUEUEDROP_TEST_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          let connection = process.env.TEST_DATABASE_URL.trim();
          if (connection.startsWith('psql ')) connection = connection.slice(5).trim();
          connection = connection.replace(/^(?:export\s+)?(?:QUEUEDROP_TEST_DATABASE_URL|DATABASE_URL)\s*=\s*/, '');
          if ((connection.startsWith('"') && connection.endsWith('"')) || (connection.startsWith("'") && connection.endsWith("'")) || (connection.startsWith('`') && connection.endsWith('`'))) connection=connection.slice(1,-1).trim();
          let u;
          try { u = new URL(connection); }
          catch {
            console.error('Invalid database URL format. Safe diagnostics: '+JSON.stringify({postgresScheme:/^postgres(?:ql)?:\/\//.test(connection),multipleLines:/[\r\n]/.test(connection),passwordPlaceholder:/\[YOUR[-_]PASSWORD\]/i.test(connection),containsTestRef:connection.includes('tcgiwtfhqssulxwawimh')}));
            process.exit(1);
          }
          const env = {...process.env, PGHOST:u.hostname, PGPORT:u.port || '5432', PGUSER:decodeURIComponent(u.username), PGPASSWORD:decodeURIComponent(u.password), PGDATABASE:u.pathname.slice(1), PGSSLMODE:'require', PGCONNECT_TIMEOUT:'15', PGOPTIONS:'-c default_transaction_read_only=on'};
          const r = spawnSync('docker', ['run','--rm',...['PGHOST','PGPORT','PGUSER','PGPASSWORD','PGDATABASE','PGSSLMODE','PGCONNECT_TIMEOUT','PGOPTIONS'].flatMap(k=>['-e',k]),'postgres:17','psql','-X','-Atq','-v','ON_ERROR_STOP=1','-c','BEGIN READ ONLY; SHOW transaction_read_only; ROLLBACK;'],{env,encoding:'utf8',timeout:120000});
          if(r.status!==0){
            const error=String(r.stderr || '')+' '+String(r.error?.code || '');
            const category=/password authentication failed/i.test(error)?'PASSWORD_AUTH_FAILED':/Tenant or user not found/i.test(error)?'POOLER_USER_NOT_FOUND':/Network is unreachable|Cannot assign requested address/i.test(error)?'IPV6_UNREACHABLE_USE_SESSION_POOLER':/could not translate host name|Name or service not known/i.test(error)?'DNS_LOOKUP_FAILED':/timeout|timed out|ETIMEDOUT/i.test(error)?'CONNECTION_TIMEOUT':/connection refused/i.test(error)?'CONNECTION_REFUSED':'CONNECTION_FAILED';
            console.error('Safe connection diagnostic: '+JSON.stringify({category,directConnection:u.hostname.startsWith('db.'),sessionPooler:u.hostname.endsWith('.pooler.supabase.com')&&u.port==='5432',passwordPlaceholder:/\\[YOUR[-_]PASSWORD\\]/i.test(decodeURIComponent(u.password))}));
            process.exit(1);
          }
          assert.equal(r.stdout.trim(),'on');
          console.log('PASS: Dedicated TEST database reached in read-only mode');
          NODE
      - name: Export encrypted Production backup and verify isolated restore
        run: node scripts/production-backup-rehearsal.mjs
        env:
          QUEUEDROP_PROD_DB_PASSWORD: ${{ secrets.QUEUEDROP_PROD_DB_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: live-reset-production-encrypted-backup
          path: encrypted-production-backup/
          retention-days: 7
          if-no-files-found: error
      - name: Remove runner files
        if: always()
        run: rm -rf encrypted-production-backup
