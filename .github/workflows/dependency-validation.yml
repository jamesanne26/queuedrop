name: Reviewed dependency validation
on:
  push:
    branches: [maintenance/reviewed-dependency-updates]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queuedrop-reviewed-dependencies
  cancel-in-progress: false
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      QUEUEDROP_TEST_SUPABASE_ANON_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
      QUEUEDROP_TEST_BASE_URL: http://127.0.0.1:3000
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_FORBIDDEN_BUSINESS_ID: ${{ secrets.E2E_FORBIDDEN_BUSINESS_ID }}
      SMS_DELIVERY_PAUSED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve reviewed packages and commit exact lockfile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          expected='https://tcgiwtfhqssulxwawimh.supabase.co'
          assert os.environ['QUEUEDROP_TEST_SUPABASE_URL'].rstrip('/')==expected, 'TEST project mismatch'
          assert os.environ['NEXT_PUBLIC_SUPABASE_URL'].rstrip('/')==expected, 'App must use TEST database'
          PY
          npm install --save-exact @supabase/ssr@0.12.7 @supabase/supabase-js@2.117.2
          npm install --save-dev --save-exact eslint-config-next@16.3.8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pin reviewed Supabase and Next lint packages with resolved lockfile'
            git push origin HEAD:maintenance/reviewed-dependency-updates
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/tested-revision.txt"
      - name: Clean dependency install
        run: npm ci
      - name: Lint, types, unit, database, SMS and secret checks
        run: npm run quality
      - name: TEST schema and database integration
        run: |
          node scripts/verify-test-deployment.mjs --schema-only
          npm run test:integration:required
      - run: npx playwright install --with-deps chromium
      - name: Candidate browser regression against local build and TEST database
        run: |
          cat > playwright.dependencies.config.mjs <<'JS'
          import config from './playwright.config.mjs';
          export default {
            ...config,
            use: { ...config.use, baseURL: 'http://127.0.0.1:3000' },
            webServer: {
              command: 'npm run build && npm run start -- --hostname 127.0.0.1 --port 3000',
              url: 'http://127.0.0.1:3000/api/health?liveness=1',
              reuseExistingServer: false,
              timeout: 180000,
            },
          };
          JS
          npx playwright test --config playwright.dependencies.config.mjs
      - name: Artifact compatibility fixture
        run: |
          mkdir -p "$RUNNER_TEMP/roundtrip"
          cp "$RUNNER_TEMP/tested-revision.txt" "$RUNNER_TEMP/roundtrip/fixture.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-action-roundtrip
          path: ${{ runner.temp }}/roundtrip/fixture.txt
      - uses: actions/download-artifact@v8
        with:
          name: dependency-action-roundtrip
          path: ${{ runner.temp }}/downloaded-roundtrip
      - name: Verify artifact content and record tested revision
        run: |
          cmp "$RUNNER_TEMP/roundtrip/fixture.txt" "$RUNNER_TEMP/downloaded-roundtrip/fixture.txt"
          echo 'Full app, TEST database, browser and artifact compatibility checks passed.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/tested-revision.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reviewed-dependency-browser-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify Java setup and Android build
        working-directory: android-printbridge
        run: chmod +x gradlew && ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-dependency-android
          path: |
            android-printbridge/app/build/outputs/apk/release/*.apk
            android-printbridge/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: error
