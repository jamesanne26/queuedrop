name: Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [test]
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUEUEDROP_TEST_BASE_URL: ${{ secrets.QUEUEDROP_TEST_BASE_URL }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check browser E2E configuration
        id: e2e-config
        shell: bash
        run: |
          if [[ -n "$QUEUEDROP_TEST_BASE_URL" && -n "$E2E_OWNER_EMAIL" && -n "$E2E_OWNER_PASSWORD" && -n "$QUEUEDROP_TEST_SUPABASE_URL" && -n "$QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium
        if: steps.e2e-config.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E regression
        if: steps.e2e-config.outputs.configured == 'true'
        run: npm run test:e2e
      - name: Browser E2E not configured
        if: steps.e2e-config.outputs.configured != 'true'
        run: echo "Browser E2E secrets are not configured yet. Skipping browser regression."
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
