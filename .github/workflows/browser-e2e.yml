name: Browser E2E

on:
  push:
    branches: [test]
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

concurrency:
  group: queuedrop-browser-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUEUEDROP_TEST_BASE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      QUEUEDROP_E2E_USE_REMOTE: "true"
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_ANON_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'test' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The revision verifier waits up to 10 minutes for the matching TEST
      # deployment, preventing E2E from testing an older Cloudflare build.
      - name: Verify TEST schema and exact deployment
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/verify-test-deployment.mjs
      - name: Diagnose Cloudflare TEST availability before browser regression
        shell: bash
        run: |
          set -euo pipefail
          for path in "/api/health?liveness=1" "/auth/login"; do
            echo "Checking TEST endpoint: $path"
            ok=0
            for attempt in 1 2 3; do
              status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${QUEUEDROP_TEST_BASE_URL}$path") || status=000
              echo "Attempt $attempt: HTTP $status"
              if [ "$status" = 200 ]; then ok=1; break; fi
              sleep $((attempt * 3))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::Cloudflare TEST endpoint $path unavailable before E2E (last HTTP $status)"
              exit 1
            fi
          done
      - name: Probe Cloudflare TEST stability and capture Ray IDs
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for path in /auth/login /auth/signup /pricing /api/health?liveness=1; do
            for attempt in $(seq 1 12); do
              headers=$(mktemp)
              status=$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 25 "${QUEUEDROP_TEST_BASE_URL}$path") || status=000
              ray=$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2 || true)
              rm -f "$headers"
              echo "Stability path=$path attempt=$attempt HTTP=$status cf-ray=${ray:-unavailable}"
              if [ "$status" != 200 ]; then failures=$((failures+1)); fi
              sleep 1
            done
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::Cloudflare TEST returned $failures non-200 responses in 48 stability probes; investigate Worker invocation logs."
            exit 1
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E regression
        run: npm run test:e2e
      - name: Diagnose TEST gateway responses after browser regression
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "/api/health?liveness=1" "/auth/login" "/auth/signup" "/pricing"; do
            for attempt in 1 2 3; do
              headers=$(mktemp)
              body=$(mktemp)
              status=$(curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}' --max-time 20 "${QUEUEDROP_TEST_BASE_URL}$path") || status=000
              ray=$(grep -i '^cf-ray:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2 || true)
              server=$(grep -i '^server:' "$headers" | tail -1 | tr -d '\r' | cut -d' ' -f2 || true)
              if [ "$status" = "503" ]; then
                echo "TEST 503 content-type=$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\\r' | cut -c1-100 || true) body-sha256=$(sha256sum "$body" | cut -d' ' -f1)"
                # Capture only a small sanitized gateway error signature.
                # Never print arbitrary application responses or secrets.
                if grep -Eiq 'no healthy upstream|cloudflare|service unavailable|error 110[0-9]' "$body"; then
                  echo "TEST gateway error signature: $(head -c 240 "$body" | tr '\\n' ' ' | sed -E 's/[[:cntrl:]]/ /g' | cut -c1-240)"
                fi
              fi
              rm -f "$headers" "$body"
              echo "TEST path=$path attempt=$attempt status=$status cf-ray=${ray:-unavailable} server=${server:-unavailable}"
              sleep 2
            done
          done
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

