name: Browser E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare TEST"]
    types: [completed]
    branches: [test]
  schedule:
    - cron: "30 18 * * *"

concurrency:
  group: queuedrop-browser-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUEUEDROP_TEST_BASE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      QUEUEDROP_E2E_USE_REMOTE: "true"
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_ANON_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'schedule' && 'test' || github.ref) }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify TEST schema and exact deployment
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          node scripts/verify-test-deployment.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E regression
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

