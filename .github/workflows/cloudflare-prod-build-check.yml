name: Cloudflare PROD build validation (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUEUEDROP_CLOUDFLARE_TARGET: production
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: https://getqueuedrop.com
      NEXT_PUBLIC_SITE_URL: https://getqueuedrop.com
      NEXT_PUBLIC_SUPABASE_URL: https://sylvegfbkxgjfctbjfec.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QUEUEDROP_PROD_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate isolated production build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$QUEUEDROP_CLOUDFLARE_TARGET" = production
          test "$NEXT_PUBLIC_SUPABASE_URL" = https://sylvegfbkxgjfctbjfec.supabase.co
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing QUEUEDROP_PROD_SUPABASE_ANON_KEY GitHub secret"
            exit 1
          fi
          echo "PASS: production build target and public configuration verified."
      - run: npm ci
      - name: Build PROD Cloudflare bundle without deployment
        run: npm run build:vinext
      - name: Confirm build did not deploy
        run: |
          echo "PASS: build-only workflow; no Wrangler deployment or DNS changes."
