name: Quality

on:
  pull_request:
  push:
    branches: [test, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if npm audit --omit=dev --audit-level=high 2>&1 | tee "$log"; then
              rm -f "$log"
              exit 0
            fi
            if ! grep -Eqi '(^|[^0-9])(429|500|502|503|504)([^0-9]|$)|Service Unavailable|Too Many Requests|ECONNRESET|ETIMEDOUT|EAI_AGAIN' "$log"; then
              echo "::error::Security audit failed for a non-transient reason; not retrying."
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Security audit unavailable after three attempts; failing closed."
              exit 1
            fi
            echo "::warning::Transient npm registry audit error; retrying ($attempt/3)."
            sleep $((attempt * 10))
          done

      - run: npm run quality

      - name: Production compile check
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
