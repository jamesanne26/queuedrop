name: Deploy QueueDrop to Cloudflare Workers
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (TEST before PROD)"
        required: true
        type: choice
        options:
          - test
          - prod
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify required Cloudflare and Supabase configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_URL: ${{ inputs.environment == 'test' && secrets.QUEUEDROP_TEST_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DB_KEY: ${{ inputs.environment == 'test' && secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          DB_SERVICE_ROLE: ${{ inputs.environment == 'test' && secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
          test -n "$DB_URL" || { echo "::error::Missing environment Supabase URL"; exit 1; }
          test -n "$DB_KEY" || { echo "::error::Missing environment Supabase publishable key"; exit 1; }
          test -n "$DB_SERVICE_ROLE" || { echo "::error::Missing environment service role secret"; exit 1; }
      - name: Install and validate
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm run test:unit
          npx --yes vinext init
      - name: Build Cloudflare runtime
        env:
          NEXT_PUBLIC_APP_ENV: ${{ inputs.environment }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.environment == 'test' && secrets.QUEUEDROP_TEST_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.environment == 'test' && secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.environment == 'test' && 'https://queuedrop-test.vercel.app' || 'https://getqueuedrop.com' }}
        run: npx vite build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name "queuedrop-${{ inputs.environment }}"
      - name: Configure server-only Supabase secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.environment == 'test' && secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name "queuedrop-${{ inputs.environment }}"
