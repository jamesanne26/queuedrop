name: Deploy QueueDrop to Cloudflare Workers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'proxy.ts'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (TEST before PROD)"
        required: true
        type: choice
        options:
          - test
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    if: github.event_name == 'push' || inputs.environment == 'test'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify required Cloudflare and Supabase configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          DB_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
          DB_SERVICE_ROLE: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
          test -n "$DB_URL" || { echo "::error::Missing environment Supabase URL"; exit 1; }
          test -n "$DB_KEY" || { echo "::error::Missing environment Supabase publishable key"; exit 1; }
          test -n "$DB_SERVICE_ROLE" || { echo "::error::Missing environment service role secret"; exit 1; }
      - name: Install and validate
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm run test:unit
          npx --yes vinext init
      - name: Isolate Cloudflare TEST Worker
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'cloudflare.config.ts';
          if (!fs.existsSync(path)) throw new Error('Cloudflare configuration missing after vinext init');
          let config = fs.readFileSync(path, 'utf8');
          const pattern = /(\bname\s*:\s*['\"])(queuedrop)(['\"])/g;
          const matches = [...config.matchAll(pattern)];
          if (matches.length !== 1) throw new Error('Expected exactly one Worker name in Cloudflare config');
          config = config.replace(pattern, '$1queuedrop-test$3');
          fs.writeFileSync(path, config);
          console.log('Isolated TEST Worker name configured');
          NODE
      - name: Embed public Supabase configuration in browser bundles
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const configPath = 'vite.config.ts';
          if (!fs.existsSync(configPath)) throw new Error('vinext Vite configuration was not generated');
          let source = fs.readFileSync(configPath, 'utf8');
          const marker = /defineConfig\(\s*\{/;
          if (!marker.test(source)) throw new Error('Unexpected vinext Vite configuration format');
          // Vite does not automatically replace Next.js NEXT_PUBLIC_* references.
          // Only publishable values are embedded; service-role credentials stay server-side.
          source = source.replace(marker, `defineConfig({
            define: {
              "process.env.NEXT_PUBLIC_SUPABASE_URL": JSON.stringify(process.env.NEXT_PUBLIC_SUPABASE_URL),
              "process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY": JSON.stringify(process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY),
              "process.env.NEXT_PUBLIC_SITE_URL": JSON.stringify(process.env.NEXT_PUBLIC_SITE_URL),
              "process.env.NEXT_PUBLIC_APP_ENV": JSON.stringify(process.env.NEXT_PUBLIC_APP_ENV),
            },`);
          fs.writeFileSync(configPath, source);
          NODE
      - name: Build Cloudflare runtime
        env:
          NEXT_PUBLIC_APP_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
        run: npx vite build
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx @vinext/cloudflare deploy

      - name: Configure TEST runtime Supabase secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$TEST_SUPABASE_URL" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_URL --name queuedrop-test
          printf '%s' "$TEST_SUPABASE_ANON_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY --name queuedrop-test
          printf '%s' "$TEST_SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name queuedrop-test

      - name: Verify Cloudflare TEST database readiness
        run: |
          set -euo pipefail
          url="https://queuedrop-test.jamesrae-rosario18.workers.dev/api/health"
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --show-error --max-time 25 --output /tmp/cloudflare-health.json --write-out '%{http_code}' "$url") || code=000
            if [[ "$code" == "200" ]] && node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/cloudflare-health.json","utf8")); if(d.status!=="ok") process.exit(1)' ; then
              echo "Cloudflare TEST database readiness passed"
              exit 0
            fi
            echo "Database readiness attempt $attempt: HTTP $code"
            node -e 'try { const d=JSON.parse(require("fs").readFileSync("/tmp/cloudflare-health.json","utf8")); console.log("Readiness diagnostic:",JSON.stringify({status:d.status,database:d.database,environment:d.environment,diagnostics:d.diagnostics})); } catch { console.log("Readiness response was not JSON"); }'
            sleep 5
          done
          echo "::error::Cloudflare TEST database readiness failed"
          exit 1

      - name: Smoke test Cloudflare TEST deployment
        run: |
          set -euo pipefail
          url="https://queuedrop-test.jamesrae-rosario18.workers.dev/"
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --show-error --location --max-time 25 --output /tmp/cloudflare-smoke.html --write-out '%{http_code}' "$url") || code=000
            if [[ "$code" == "200" ]] && [[ -s /tmp/cloudflare-smoke.html ]]; then
              echo "TEST homepage returned HTTP 200 with non-empty response"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 5
          done
          echo "::error::TEST Worker did not return a healthy HTTP response"
          exit 1
