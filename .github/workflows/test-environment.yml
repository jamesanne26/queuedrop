name: QueueDrop TEST checks

on:
  workflow_dispatch:
  push:
    branches: [test]

concurrency:
  group: test-environment
  cancel-in-progress: true

jobs:
  integration-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply reliability migration to dedicated TEST database
        run: node scripts/apply-test-reliability-migration.mjs
        env:
          QUEUEDROP_TEST_DATABASE_URL: ${{ secrets.QUEUEDROP_TEST_DATABASE_URL }}
          QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      - name: Check TEST schema
        run: node scripts/verify-test-deployment.mjs --schema-only
        env:
          QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Supabase integration contracts
        run: npm run test:integration:required
        env:
          QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          QUEUEDROP_TEST_SUPABASE_ANON_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_FORBIDDEN_BUSINESS_ID: ${{ secrets.E2E_FORBIDDEN_BUSINESS_ID }}
      - name: Wait for this TEST deployment
        run: node scripts/verify-test-deployment.mjs
        env:
          QUEUEDROP_TEST_BASE_URL: ${{ secrets.QUEUEDROP_TEST_BASE_URL }}
          QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      - name: Deployment smoke
        run: npm run test:smoke:required
        env:
          QUEUEDROP_TEST_BASE_URL: ${{ secrets.QUEUEDROP_TEST_BASE_URL }}

