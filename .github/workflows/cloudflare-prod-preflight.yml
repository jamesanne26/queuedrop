name: Cloudflare PROD preflight (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_SUPABASE_URL: ${{ secrets.QUEUEDROP_PROD_SUPABASE_URL }}
      PROD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QUEUEDROP_PROD_SUPABASE_ANON_KEY }}
      PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_PROD_SUPABASE_SERVICE_ROLE_KEY }}
      PROD_PAYMONGO_SECRET_KEY: ${{ secrets.QUEUEDROP_PROD_PAYMONGO_SECRET_KEY }}
      PROD_PAYMONGO_WEBHOOK_SECRET: ${{ secrets.QUEUEDROP_PROD_PAYMONGO_WEBHOOK_SECRET }}
    steps:
      - name: Validate required PROD credentials without revealing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROD_SUPABASE_URL PROD_SUPABASE_PUBLISHABLE_KEY PROD_SUPABASE_SERVICE_ROLE_KEY PROD_PAYMONGO_SECRET_KEY PROD_PAYMONGO_WEBHOOK_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required GitHub secret mapped to $key"
              missing=1
            fi
          done
          if [ -n "${PROD_SUPABASE_URL:-}" ] && [ "$PROD_SUPABASE_URL" != "https://sylvegfbkxgjfctbjfec.supabase.co" ]; then
            echo "::error::PROD Supabase URL does not match the known production project"
            missing=1
          fi
          if [ -n "${PROD_PAYMONGO_SECRET_KEY:-}" ] && [[ "$PROD_PAYMONGO_SECRET_KEY" != sk_live_* ]]; then
            echo "::error::PROD PayMongo secret is not a live key"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "PASS: required PROD secret mappings are present and basic checks passed."
      - name: Confirm production Supabase endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$PROD_SUPABASE_URL/auth/v1/health")
          if [ "$code" != 200 ]; then
            echo "::error::Production Supabase auth health returned HTTP $code"
            exit 1
          fi
          echo "PASS: production Supabase auth health endpoint responded."
      - name: Verify Cloudflare PROD Worker secret bindings
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/queuedrop/secrets")
          echo "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("success"):
              print("::error::Cloudflare PROD secrets API returned an error")
              sys.exit(1)
          present = {item["name"] for item in data.get("result", [])}
          required = {
              "NEXT_PUBLIC_APP_ENV",
              "NEXT_PUBLIC_APP_URL",
              "NEXT_PUBLIC_SITE_URL",
              "NEXT_PUBLIC_SUPABASE_URL",
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "PAYMONGO_SECRET_KEY",
              "PAYMONGO_WEBHOOK_SECRET",
              "CRON_SECRET",
              "QUEUEDROP_SUPPORT_EMAIL",
              "RESEND_API_KEY",
              "SEMAPHORE_API_KEY",
          }
          missing = sorted(required - present)
          if missing:
              for name in missing:
                  print(f"::error::Cloudflare PROD binding missing: {name}")
              sys.exit(1)
          print("PASS: required Cloudflare PROD binding names are present (values not exposed).")
          '
      - name: Verify dedicated production R2 cache bucket exists
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")
          printf '%s' "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          if not data.get("success"):
              print("::error::Unable to verify Cloudflare R2 buckets")
              sys.exit(1)
          buckets = {item.get("name") for item in data.get("result", {}).get("buckets", [])}
          required = "queuedrop-response-store-cache-bodies"
          if required not in buckets:
              print(f"::error::Missing isolated PROD R2 cache bucket: {required}")
              sys.exit(1)
          print("PASS: dedicated PROD cache bucket exists.")
          '
      - name: Verify PROD deployment isolation and readiness safeguards
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('cloudflare.config.ts', 'utf8');
          const testDeploy = fs.readFileSync('.github/workflows/deploy-cloudflare-test.yml', 'utf8');
          if (!config.includes('process.env.QUEUEDROP_CLOUDFLARE_TARGET === "production"') || !config.includes('isProduction ? "queuedrop" : "queuedrop-test"') || !config.includes('name: workerName')) {
            console.error('::error::TEST worker configuration changed; review environment isolation.');
            process.exit(1);
          }
          if (!testDeploy.includes('branches: [test]')) {
            console.error('::error::TEST deployment branch guard missing.');
            process.exit(1);
          }
          console.log('PASS: TEST deployment still targets the TEST Worker.');
          console.log('NOTICE: Dedicated PROD build/deploy configuration must be validated before production deployment.');
          NODE
      - name: Preflight only - never deploy
        run: |
          echo "PASS: This workflow does not modify PROD or deploy any Worker."
