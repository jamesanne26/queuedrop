name: Prepare signed release APK in TEST
on:
  push:
    branches: [test]
    paths: ['.github/workflows/prepare-release-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-release-apk-preparation
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check signing inputs
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/production.jks"
      - name: Test and build release
        working-directory: android-printbridge
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - name: Sign and verify upgrade compatibility
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RUNNER_TEMP/signed"
          apk="$RUNNER_TEMP/signed/QueueDrop-PrintBridge-v1.1.2.apk"
          "$tools/zipalign" -p -f 4 android-printbridge/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/production.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/new-cert.txt"
          "$tools/apksigner" verify --print-certs public/installers/QueueDrop-PrintBridge-v1.1.1.apk > "$RUNNER_TEMP/old-cert.txt"
          sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt" | sort -u > "$RUNNER_TEMP/new-digests.txt"
          sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-cert.txt" | sort -u > "$RUNNER_TEMP/old-digests.txt"
          if ! diff -u "$RUNNER_TEMP/old-digests.txt" "$RUNNER_TEMP/new-digests.txt"; then
            echo "::error::Signing certificate differs from approved v1.1.1; direct upgrade is blocked."
            exit 1
          fi
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/new-badging.txt"
          "$tools/aapt" dump badging public/installers/QueueDrop-PrintBridge-v1.1.1.apk > "$RUNNER_TEMP/old-badging.txt"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          def package(name):
              text = (root / name).read_text()
              return re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", text).groups()
          new, old = package('new-badging.txt'), package('old-badging.txt')
          assert new[0] == old[0] == 'com.getqueuedrop.printbridge', 'Application ID mismatch'
          assert int(new[1]) > int(old[1]), 'Version code must increase'
          assert new[2] == '1.1.2', 'Unexpected release version'
          PY
          cd "$RUNNER_TEMP/signed"
          sha256sum QueueDrop-PrintBridge-v1.1.2.apk > SHA256SUMS
          python3 <<'PYMETA'
          from pathlib import Path
          import hashlib, json, os
          apk=Path('QueueDrop-PrintBridge-v1.1.2.apk')
          manifest={'version':'1.1.2','applicationId':'com.getqueuedrop.printbridge','bytes':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'sourceCommit':os.environ['GITHUB_SHA'],'sourceRun':os.environ['GITHUB_RUN_ID'],'certificateMatchesPrevious':True,'hardwarePrinterVerified':False}
          apk.with_suffix('.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PYMETA
      - uses: actions/upload-artifact@v7
        with:
          name: queuedrop-release-candidate-signed
          path: ${{ runner.temp }}/signed/*
          if-no-files-found: error
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/production.jks"
