name: Test migration replay

on:
  pull_request:
    branches: [test]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/migration_replay_assertions.sql"
      - "supabase/config.toml"
      - ".github/workflows/test-migration-replay.yml"
  push:
    branches: [test]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/migration_replay_assertions.sql"
      - "supabase/config.toml"
      - ".github/workflows/test-migration-replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start isolated local Supabase
        run: npx --yes supabase@2.120.0 start

      - name: Rebuild database from migrations
        run: npx --yes supabase@2.120.0 db reset --local --no-seed

      - name: Assert schema and migration history
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop$')"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/migration_replay_assertions.sql

      - name: Rehearse isolated database backup and restore
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup
)"
          test -n "$db_container"
          # Export a logical backup of the disposable database; no hosted client data.
          docker exec "$db_container" pg_dump -U postgres -d postgres -Fc > /tmp/queuedrop-rehearsal.dump
          test -s /tmp/queuedrop-rehearsal.dump
          docker exec "$db_container" createdb -U postgres queuedrop_restore_rehearsal
          docker exec -i "$db_container" pg_restore -U postgres -d queuedrop_restore_rehearsal --no-owner --no-acl --exit-on-error < /tmp/queuedrop-rehearsal.dump
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -Atc "
            DO \\\$\\\$ BEGIN
              IF to_regclass('public.businesses') IS NULL
                OR to_regclass('public.tickets') IS NULL
                OR to_regclass('public.payments') IS NULL
                OR to_regclass('support_private.sessions') IS NULL THEN
                RAISE EXCEPTION 'Restore missing core QueueDrop tables';
              END IF;
            END \\\$\\\$;"
          echo "Isolated logical backup/restore rehearsal passed."

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup
