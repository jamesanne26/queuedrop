name: Test migration replay

on:
  pull_request:
    branches: [test]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/migration_replay_assertions.sql"
      - "supabase/tests/paymongo_production_preflight.sql"
      - "supabase/tests/paymongo_parallel_checkout.sh"
      - "supabase/tests/paymongo_parallel_invoice.sh"
      - "supabase/config.toml"
      - ".github/workflows/test-migration-replay.yml"
  push:
    branches: [test]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/migration_replay_assertions.sql"
      - "supabase/tests/paymongo_production_preflight.sql"
      - "supabase/tests/paymongo_parallel_checkout.sh"
      - "supabase/tests/paymongo_parallel_invoice.sh"
      - "supabase/config.toml"
      - ".github/workflows/test-migration-replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start isolated local Supabase
        run: npx --yes supabase@2.120.0 start

      - name: Rebuild database from migrations
        run: npx --yes supabase@2.120.0 db reset --local --no-seed

      - name: Assert schema and migration history
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop$')"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/migration_replay_assertions.sql

      - name: Assert PayMongo migration preflight
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop$')"
          test -n "$db_container"
          result="$(docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -At -F '|' < supabase/tests/paymongo_production_preflight.sql)"
          printf '%s\n' "$result"
          for name in missing_atomic_checkout_function missing_atomic_invoice_function missing_invoice_unique_index missing_invoice_reference_index checkout_function_exposed_to_authenticated invoice_function_exposed_to_authenticated; do
            printf '%s\n' "$result" | grep -qx "$name|NO"
          done
          for name in checkout_function_exposed_to_anon invoice_function_exposed_to_anon; do
            printf '%s\n' "$result" | grep -qx "$name|NO"
          done
          for name in checkout_function_executable_by_service_role invoice_function_executable_by_service_role; do
            printf '%s\n' "$result" | grep -qx "$name|YES"
          done
          printf '%s\n' "$result" | grep -qx 'invalid_or_unready_invoice_indexes|0'
          for name in duplicate_provider_payment_ids duplicate_paymongo_subscription_invoices duplicate_paymongo_invoice_references_all_methods; do
            printf '%s\n' "$result" | grep -qx "$name|0"
          done
      - name: Enforce read-only release audit
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop
        run: bash supabase/tests/paymongo_parallel_checkout.sh

      - name: Assert parallel PayMongo invoice renewal
        run: bash supabase/tests/paymongo_parallel_invoice.sh

      - name: Rehearse isolated database backup and restore
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop$')"
          test -n "$db_container"
          docker exec "$db_container" pg_dump -U postgres -d postgres -Fc --schema=public --schema=support_private > /tmp/queuedrop-rehearsal.dump
          test -s /tmp/queuedrop-rehearsal.dump
          docker exec "$db_container" createdb -U postgres queuedrop_restore_rehearsal
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE;"
          # Supply a minimal auth.users dependency in this disposable database; no real users are copied.
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY);"
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -c "CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';"
          # Restore only application schemas; managed Supabase system schemas are provisioned separately.
          docker exec -i "$db_container" pg_restore -U postgres -d queuedrop_restore_rehearsal --no-owner --no-acl --exit-on-error < /tmp/queuedrop-rehearsal.dump
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN to_regclass('public.businesses') IS NOT NULL AND to_regclass('public.tickets') IS NOT NULL AND to_regclass('public.payments') IS NOT NULL AND to_regclass('support_private.sessions') IS NOT NULL THEN 'RESTORE PASS' ELSE 'RESTORE FAIL' END" | grep -x 'RESTORE PASS'

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup
)"
          test -n "$db_container"
          result="$(docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -At -F '|' < supabase/tests/read_only_release_audit.sql)"
          printf '%s\n' "$result"
          if printf '%s\n' "$result" | grep -E '\|FAIL\|'; then
            echo "Release audit failed"
            exit 1
          fi
          test "$(printf '%s\n' "$result" | grep -c '|PASS|')" -eq 6

      - name: Assert parallel PayMongo checkout fulfillment
        run: bash supabase/tests/paymongo_parallel_checkout.sh

      - name: Assert parallel PayMongo invoice renewal
        run: bash supabase/tests/paymongo_parallel_invoice.sh

      - name: Rehearse isolated database backup and restore
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_queuedrop$')"
          test -n "$db_container"
          docker exec "$db_container" pg_dump -U postgres -d postgres -Fc --schema=public --schema=support_private > /tmp/queuedrop-rehearsal.dump
          test -s /tmp/queuedrop-rehearsal.dump
          docker exec "$db_container" createdb -U postgres queuedrop_restore_rehearsal
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -c "DROP SCHEMA public CASCADE;"
          # Supply a minimal auth.users dependency in this disposable database; no real users are copied.
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY);"
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -c "CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';"
          # Restore only application schemas; managed Supabase system schemas are provisioned separately.
          docker exec -i "$db_container" pg_restore -U postgres -d queuedrop_restore_rehearsal --no-owner --no-acl --exit-on-error < /tmp/queuedrop-rehearsal.dump
          docker exec "$db_container" psql -U postgres -d queuedrop_restore_rehearsal -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN to_regclass('public.businesses') IS NOT NULL AND to_regclass('public.tickets') IS NOT NULL AND to_regclass('public.payments') IS NOT NULL AND to_regclass('support_private.sessions') IS NOT NULL THEN 'RESTORE PASS' ELSE 'RESTORE FAIL' END" | grep -x 'RESTORE PASS'

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.120.0 stop --no-backup
