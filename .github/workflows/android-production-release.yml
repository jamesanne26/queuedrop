name: Signed Production APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-apk-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Check signing inputs
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/production.jks"
      - name: Test and build release
        working-directory: android-printbridge
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest assembleRelease --no-daemon
      - name: Sign and verify upgrade compatibility
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$RUNNER_TEMP/signed"
          apk="$RUNNER_TEMP/signed/QueueDrop-PrintBridge-v1.1.1.apk"
          "$tools/zipalign" -p -f 4 android-printbridge/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/production.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/new-cert.txt"
          "$tools/apksigner" verify --print-certs public/installers/QueueDrop-PrintBridge-v1.1.0-debug.apk > "$RUNNER_TEMP/old-cert.txt"
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/new-cert.txt" > "$RUNNER_TEMP/new-digests.txt"
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/old-cert.txt" > "$RUNNER_TEMP/old-digests.txt"
          if ! diff -u "$RUNNER_TEMP/old-digests.txt" "$RUNNER_TEMP/new-digests.txt"; then
            echo "::error::Signing certificate differs from installed v1.1.0; direct upgrade is blocked."
            exit 1
          fi
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/new-badging.txt"
          "$tools/aapt" dump badging public/installers/QueueDrop-PrintBridge-v1.1.0-debug.apk > "$RUNNER_TEMP/old-badging.txt"
          python3 - "$RUNNER_TEMP" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          def package(name):
              text = (root / name).read_text()
              return re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", text).groups()
          new, old = package('new-badging.txt'), package('old-badging.txt')
          assert new[0] == old[0] == 'com.getqueuedrop.printbridge', 'Application ID mismatch'
          assert int(new[1]) > int(old[1]), 'Version code must increase'
          assert new[2] == '1.1.1', 'Unexpected release version'
          PY
          cd "$RUNNER_TEMP/signed"
          sha256sum QueueDrop-PrintBridge-v1.1.1.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: queuedrop-production-signed
          path: ${{ runner.temp }}/signed/*
          if-no-files-found: error
      - name: Publish verified production installer
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/signed/QueueDrop-PrintBridge-v1.1.1.apk" public/installers/
          cp "$RUNNER_TEMP/signed/SHA256SUMS" public/installers/QueueDrop-PrintBridge-v1.1.1.sha256
          python3 <<'PY'
          from pathlib import Path
          import hashlib, json, os
          apk = Path('public/installers/QueueDrop-PrintBridge-v1.1.1.apk')
          manifest = {
              'version': '1.1.1', 'applicationId': 'com.getqueuedrop.printbridge',
              'bytes': apk.stat().st_size, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sourceRun': os.environ['GITHUB_RUN_ID'], 'certificateMatchesPrevious': True,
          }
          Path('public/installers/QueueDrop-PrintBridge-v1.1.1.json').write_text(json.dumps(manifest, indent=2) + '\n')
          settings = Path('app/dashboard/settings/page.tsx')
          text = settings.read_text()
          replacements = {
              'isTestInstaller ? "1.1.1 TEST" : "1.1.0"': 'isTestInstaller ? "1.1.1 TEST" : "1.1.1"',
              '"/installers/QueueDrop-PrintBridge-v1.1.0-debug.apk"': '"/installers/QueueDrop-PrintBridge-v1.1.1.apk"',
              'isTestInstaller ? "QueueDrop-PrintBridge-v1.1.1-test.apk" : "QueueDrop-PrintBridge-v1.1.0.apk"': 'isTestInstaller ? "QueueDrop-PrintBridge-v1.1.1-test.apk" : "QueueDrop-PrintBridge-v1.1.1.apk"',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, 'Installer settings changed; review before publishing'
              text = text.replace(old, new)
          settings.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/installers/QueueDrop-PrintBridge-v1.1.1* app/dashboard/settings/page.tsx
          git commit -m "Publish verified signed production Print Bridge v1.1.1"
          git push origin HEAD:main
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/production.jks"
