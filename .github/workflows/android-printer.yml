name: Android Printer Regression
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  printer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-printbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: queuedrop-printbridge-test
          path: |
            android-printbridge/app/build/outputs/apk/debug/*.apk
            android-printbridge/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: queuedrop-printbridge-unsigned-release
          path: |
            android-printbridge/app/build/outputs/apk/release/*-unsigned.apk
            android-printbridge/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: error
