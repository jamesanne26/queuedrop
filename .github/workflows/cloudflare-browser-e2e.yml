name: Cloudflare TEST Browser E2E
on:
  workflow_run:
    workflows: ['Deploy QueueDrop to Cloudflare Workers']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: queuedrop-cloudflare-browser-e2e
  cancel-in-progress: true
jobs:
  browser-e2e:
    # Do not run stale main tests against the fix branch's TEST deployment.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    env:
      QUEUEDROP_TEST_BASE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Cloudflare TEST readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 25 "$QUEUEDROP_TEST_BASE_URL/api/health" > /tmp/queuedrop-health.json
          node -e 'const d=require("/tmp/queuedrop-health.json"); if(d.status!=="ok") process.exit(1)'
      - name: Create isolated CI-only business-owner credentials
        run: |
          set -euo pipefail
          echo "E2E_OWNER_EMAIL=cloudflare-e2e-${GITHUB_RUN_ID}@example.com" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Validate dedicated TEST business-owner fixture
        run: node -e 'import("./tests/e2e/global-setup.mjs").then(m=>m.default())'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Cloudflare browser regression
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
