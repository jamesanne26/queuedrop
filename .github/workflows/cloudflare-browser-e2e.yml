name: Cloudflare TEST Browser E2E
on:
  workflow_run:
    workflows: ['Deploy QueueDrop to Cloudflare Workers']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [fix/cloudflare-browser-e2e-runtime-20261103]
    paths:
      - '.github/workflows/cloudflare-browser-e2e.yml'
      - '.github/workflows/cloudflare-deploy.yml'
      - 'tests/e2e/**'
      - 'app/**'
      - 'lib/**'
      - 'proxy.ts'
      - 'playwright.config.mjs'
permissions:
  contents: read
concurrency:
  group: queuedrop-cloudflare-browser-e2e
  cancel-in-progress: true
jobs:
  browser-e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    env:
      QUEUEDROP_TEST_BASE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check exact Cloudflare TEST revision before creating fixtures
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          for attempt in $(seq 1 40); do
            code=$(curl --silent --show-error --max-time 20 --output /tmp/queuedrop-health.json --write-out '%{http_code}' "$QUEUEDROP_TEST_BASE_URL/api/health") || code="000"
            if [[ "$code" == "200" ]] && EXPECTED_REVISION="$expected" node - <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/queuedrop-health.json", "utf8"));
          const expected = process.env.EXPECTED_REVISION.slice(0, 12);
          if (health.status !== "ok" || health.database !== "ok" || health.revision !== expected) process.exit(1);
          console.log("Verified Cloudflare TEST deployment revision:", expected);
          NODE
            then
              exit 0
            fi
            echo "Cloudflare TEST revision not ready, attempt $attempt (HTTP $code)"
            sleep 15
          done
          echo "::error::Cloudflare TEST never reached exact expected commit: ${expected:0:12}"
          exit 1
      - name: Create isolated CI-only business-owner credentials
        run: |
          set -euo pipefail
          echo "E2E_OWNER_EMAIL=cloudflare-e2e-${GITHUB_RUN_ID}@example.com" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Validate dedicated TEST business-owner fixture
        run: node -e 'import("./tests/e2e/global-setup.mjs").then(m=>m.default())'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Cloudflare browser regression
        env:
          E2E_REUSE_AUTH_STATE: "1"
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
