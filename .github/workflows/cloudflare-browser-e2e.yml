name: Cloudflare TEST Browser E2E
on:
  workflow_run:
    workflows: ['Deploy QueueDrop to Cloudflare Workers']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main, fix/cloudflare-release-e2e-20261103]
    paths:
      - 'tests/e2e/**'
      - 'tests/unit/**'
      - 'playwright.config.mjs'
      - '.github/workflows/cloudflare-browser-e2e.yml'
permissions:
  contents: read
concurrency:
  group: queuedrop-cloudflare-browser-e2e-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true
jobs:
  browser-e2e:
    # Do not run stale main tests against the fix branch's TEST deployment.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    env:
      QUEUEDROP_TEST_BASE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Cloudflare TEST readiness
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/fix/cloudflare-release-e2e-20261103" ]]; then
            # Never run a new branch's tests on the old TEST Worker.
            matched=0
            for attempt in {1..60}; do
              curl --fail --silent --show-error --max-time 25 "$QUEUEDROP_TEST_BASE_URL/api/health" > /tmp/queuedrop-health.json || true
              if node -e 'const d=require("/tmp/queuedrop-health.json"); if(d.status!=="ok" || d.revision !== process.env.GITHUB_SHA.slice(0,12)) process.exit(1)' ; then
                echo "Correct Cloudflare TEST revision ready: ${GITHUB_SHA:0:12}"
                matched=1
                break
              fi
              echo "Waiting for Cloudflare TEST commit ${GITHUB_SHA:0:12} (attempt $attempt)"
              sleep 10
            done
            if [[ "$matched" != "1" ]]; then
              echo "::error::Expected Cloudflare TEST revision was not deployed"
              exit 1
            fi
          else
            curl --fail --silent --show-error --max-time 25 "$QUEUEDROP_TEST_BASE_URL/api/health" > /tmp/queuedrop-health.json
            node -e 'const d=require("/tmp/queuedrop-health.json"); if(d.status!=="ok") process.exit(1)'
          fi
      - name: Create isolated CI-only business-owner credentials
        run: |
          set -euo pipefail
          echo "E2E_OWNER_EMAIL=cloudflare-e2e-${GITHUB_RUN_ID}@example.com" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_OWNER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Validate dedicated TEST business-owner fixture
        run: node -e 'import("./tests/e2e/global-setup.mjs").then(m=>m.default())'
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Cloudflare browser regression
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
