name: Deploy Cloudflare TEST

on:
  workflow_dispatch:
  push:
    branches: [test]

concurrency:
  group: cloudflare-test-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_APP_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      NEXT_PUBLIC_SITE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret missing"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::TEST Supabase URL secret missing"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::TEST Supabase anon key secret missing"; exit 1; }
      - run: npm ci
      - name: Build TEST Cloudflare Worker
        run: npm run build:vinext
      - name: Deploy TEST Cloudflare Worker
        shell: bash
        run: |
          # Cloudflare occasionally returns 503 "no healthy upstream" from its
          # management API. Retry the identical artifact; do not rebuild or
          # mask authentication, validation, or other non-transient errors.
          for attempt in 1 2 3 4; do
            set +e
            npm run deploy:vinext > /tmp/queuedrop-cloudflare-deploy.log 2>&1
            status=$?
            set -e
            cat /tmp/queuedrop-cloudflare-deploy.log
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -Eq 'no healthy upstream|503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout' /tmp/queuedrop-cloudflare-deploy.log; then
              echo "::error::Non-transient Cloudflare deploy failure; not retrying"
              exit "$status"
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Cloudflare management API still unavailable after four attempts"
              exit "$status"
            fi
            echo "::warning::Transient Cloudflare API failure; retrying deployment attempt $((attempt + 1)) of 4"
            sleep $((attempt * 15))
          done
      - name: Stamp revision only after successful deploy
        shell: bash
        run: printf '%s' "$GITHUB_SHA" | npx wrangler secret put QUEUEDROP_DEPLOYMENT_SHA --name queuedrop-test
      - name: Verify deployed TEST revision
        env:
          QUEUEDROP_TEST_BASE_URL: https://queuedrop-test.jamesrae-rosario18.workers.dev
          QUEUEDROP_TEST_SUPABASE_URL: ${{ secrets.QUEUEDROP_TEST_SUPABASE_URL }}
          QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUEUEDROP_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-test-deployment.mjs
